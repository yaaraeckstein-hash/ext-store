<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtStore | חנות התוספים הרשמית ומחולל הקוד</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #090d16;
            --surface: #111827;
            --card: #1f2937;
            --card-hover: #263244;
            --text: #f9fafb;
            --muted: #9ca3af;
            --border: #374151;
            --success: #10b981;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Navbar */
        .navbar {
            width: 100%;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            width: 100%;
            max-width: 1150px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        .logo span {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            color: var(--muted);
            border: 1px solid transparent;
            padding: 9px 18px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn:hover {
            color: #fff;
            background: var(--card);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* Hero Banner */
        .hero {
            width: 100%;
            background: linear-gradient(135deg, #1e3a8a 0%, #312e81 50%, #0f172a 100%);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .hero h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
        }

        .hero p {
            margin: 0 auto 25px auto;
            max-width: 650px;
            color: #cbd5e1;
            font-size: 1.05rem;
        }

        .search-bar {
            max-width: 550px;
            margin: 0 auto;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-bar input:focus {
            border-color: #60a5fa;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1150px;
            padding: 30px 20px;
        }

        .hidden {
            display: none !important;
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .cat-pill {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-pill.active, .cat-pill:hover {
            background: #fff;
            color: #090d16;
            font-weight: 600;
        }

        .section-title {
            font-size: 1.35rem;
            margin: 0 0 18px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Extensions Grid */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .ext-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.2s;
            position: relative;
        }

        .ext-card.featured {
            border: 1px solid #3b82f6;
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.12) 0%, var(--card) 100%);
        }

        .ext-card:hover {
            transform: translateY(-4px);
            background: var(--card-hover);
            box-shadow: 0 12px 24px rgba(0,0,0,0.35);
        }

        .featured-ribbon {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .ext-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .ext-icon {
            width: 52px;
            height: 52px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        .ext-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .ext-meta {
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 3px;
        }

        .stars {
            color: var(--gold);
        }

        .ext-desc {
            color: #d1d5db;
            font-size: 0.93rem;
            line-height: 1.5;
            margin: 0 0 20px 0;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            flex: 1;
        }

        .btn-install {
            background: var(--primary);
            color: #fff;
        }

        .btn-install:hover {
            background: var(--primary-hover);
        }

        .btn-code {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            flex: 0.5;
        }

        .btn-code:hover {
            border-color: #9ca3af;
        }

        /* Install Bar */
        .install-banner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #d1d5db;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Builder Styles */
        .builder-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 25px;
        }

        @media (max-width: 800px) {
            .builder-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        textarea {
            font-family: 'Courier New', monospace;
            direction: ltr;
            text-align: left;
            min-height: 150px;
        }

        .preview-frame {
            background: #fff;
            color: #111;
            border-radius: 12px;
            padding: 15px;
            min-height: 280px;
            border: 3px solid var(--border);
        }
    </style>
</head>
<body>

<!-- סרגל עליון -->

    <div class="nav-inner">
        <div class="logo">🧩 <span>ExtStore</span></div>
        <div class="nav-tabs">
